{% extends "base.html" %}
{% block title %}New Financial Year - AFS Compiler{% endblock %}
{% block content %}
<h1>New Financial Year - {{ entity.company_name }}</h1>
<form method="post" action="/entities/{{ entity.id }}/years/new">
  <div class="card">
    <label class="field"><span>Financial Year End (current year)</span><input type="date" name="year_end_date" required></label>
    <label class="field"><span>Financial Year End (prior/comparative year)</span><input type="date" name="comparative_year_end_date"></label>
    <label class="field"><span>Date Annual Financial Statements Approved</span><input type="date" name="date_approved"></label>
    <label class="field"><span>IFRS for SME's Edition Applied</span>
      <select name="ifrs_edition">
        <option value="Second Edition (2015)">Second Edition (2015)</option>
        <option value="Third Edition (2025) - early adopted">Third Edition (2025) - early adopted</option>
      </select>
    </label>
    <h3>Opening balances (start of the comparative/prior year)</h3>
    <label class="field"><span>Retained Income - Opening Balance</span><input type="number" step="0.01" name="opening_retained_income" value="0"></label>
    <label class="field"><span>Share Capital - Opening Balance</span><input type="number" step="0.01" name="opening_share_capital" value="0"></label>
    <label class="field"><span>Cash and Cash Equivalents - Opening Balance</span><input type="number" step="0.01" name="opening_cash" value="0"></label>
    <label class="field"><span>Prior Year Depreciation Charge (total, all asset classes)</span><input type="number" step="0.01" name="prior_year_depreciation_charge" value="0"></label>
  </div>
  <button class="btn" type="submit">Create financial year</button>
  <a class="btn secondary" href="/">Cancel</a>
</form>
{% endblock %}
